
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Reset Password - Finance Management</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: Arial, sans-serif;
        }

        .reset-wrapper {
            min-height: 100vh;
        }

        .reset-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .logo-box {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;

            margin: 0 auto 18px;
        }

        .title {
            font-weight: 700;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
        }

        .email-text {
            font-weight: 600;
            color: #212529;
            word-break: break-all;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 52px;
            border-radius: 10px;
            font-size: 16px;
        }

        .reset-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        .back-link {
            font-size: 14px;
            text-decoration: none;
        }

    </style>

</head>


<body>


<div class="container reset-wrapper d-flex align-items-center justify-content-center py-4">

    <div class="card reset-card p-4 p-md-5">


        <!-- ================= LOGO ================= -->

        <div class="logo-box">
            ₹
        </div>


        <!-- ================= HEADING ================= -->

        <div class="text-center mb-4">

            <h3 class="title mb-2">
                Reset Password
            </h3>

            <p class="subtitle mb-2">

                Enter a new password for your
                Finance Management account.

            </p>

            <div
                    id="emailDisplay"
                    class="email-text">
            </div>

        </div>


        <!-- ================= ERROR ================= -->

        <div
                id="errorMessage"
                class="alert alert-danger d-none">
        </div>


        <!-- ================= SUCCESS ================= -->

        <div
                id="successMessage"
                class="alert alert-success d-none">
        </div>


        <!-- ================= RESET FORM ================= -->

        <form id="resetPasswordForm">


            <!-- NEW PASSWORD -->

            <div class="mb-3">

                <label
                        for="newPassword"
                        class="form-label">

                    New Password

                </label>

                <input
                        type="password"
                        id="newPassword"
                        class="form-control"
                        placeholder="Enter new password"
                        required>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="mb-4">

                <label
                        for="confirmPassword"
                        class="form-label">

                    Confirm Password

                </label>

                <input
                        type="password"
                        id="confirmPassword"
                        class="form-control"
                        placeholder="Confirm new password"
                        required>

            </div>


            <!-- RESET BUTTON -->

            <div class="d-grid">

                <button
                        type="submit"
                        id="resetButton"
                        class="btn btn-primary reset-btn">

                    Reset Password

                </button>

            </div>


        </form>


        <!-- ================= BACK ================= -->

        <div class="text-center mt-4">

            <a
                    href="/login"
                    class="back-link">

                Back to Login

            </a>

        </div>


    </div>

</div>



<script>


    /*
     * =====================================================
     * GET EMAIL
     * =====================================================
     */

    const email =
        sessionStorage.getItem(
            "forgotPasswordEmail"
        );


    /*
     * Authenticator must already be verified.
     */

    const authenticatorVerified =
        sessionStorage.getItem(
            "forgotAuthenticatorVerified"
        );


    /*
     * Security check.
     */

    if (
        !email ||
        authenticatorVerified !== "true"
    ) {

        window.location.href =
            "/login";

    }


    /*
     * Show email.
     */

    document
        .getElementById("emailDisplay")
        .textContent =
        email;



    /*
     * =====================================================
     * RESET PASSWORD
     * =====================================================
     */

    document
        .getElementById("resetPasswordForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const newPassword =
                    document
                        .getElementById("newPassword")
                        .value;


                const confirmPassword =
                    document
                        .getElementById("confirmPassword")
                        .value;


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                const successMessage =
                    document.getElementById(
                        "successMessage"
                    );


                const resetButton =
                    document.getElementById(
                        "resetButton"
                    );


                errorMessage.classList.add(
                    "d-none"
                );

                successMessage.classList.add(
                    "d-none"
                );


                /*
                 * Check password match.
                 */

                if (
                    newPassword !==
                    confirmPassword
                ) {

                    errorMessage.textContent =
                        "Passwords do not match.";

                    errorMessage.classList.remove(
                        "d-none"
                    );

                    return;

                }


                /*
                 * Basic password validation.
                 */

                if (newPassword.length < 6) {

                    errorMessage.textContent =
                        "Password must be at least 6 characters.";

                    errorMessage.classList.remove(
                        "d-none"
                    );

                    return;

                }


                resetButton.disabled = true;

                resetButton.textContent =
                    "Resetting...";


                try {


                    /*
                     * Call backend.
                     */

                    const response =
                        await fetch(
                            "/reset-password",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email: email,

                                    newPassword:
                                    newPassword

                                })

                            }
                        );


                    /*
                     * Read response.
                     */

                    const text =
                        await response.text();


                    let data;

                    try {

                        data =
                            JSON.parse(text);

                    }
                    catch {

                        data = text;

                    }


                    /*
                     * Backend error.
                     */

                    if (!response.ok) {

                        let message =
                            "Unable to reset password";


                        if (
                            typeof data ===
                            "string"
                        ) {

                            message = data;

                        }
                        else if (
                            data &&
                            data.message
                        ) {

                            message =
                                data.message;

                        }


                        throw new Error(message);

                    }


                    /*
                     * Password reset successfully.
                     */

                    successMessage.textContent =
                        "Password reset successfully. Redirecting to login...";

                    successMessage.classList.remove(
                        "d-none"
                    );


                    /*
                     * Clear forgot-password session.
                     */

                    sessionStorage.removeItem(
                        "forgotPasswordEmail"
                    );

                    sessionStorage.removeItem(
                        "forgotEmailVerified"
                    );

                    sessionStorage.removeItem(
                        "forgotAuthenticatorVerified"
                    );


                    /*
                     * Go back to login.
                     */

                    setTimeout(
                        function () {

                            window.location.href =
                                "/login";

                        },
                        1200
                    );


                }
                catch (error) {

                    errorMessage.textContent =
                        error.message ||
                        "Unable to reset password";

                    errorMessage.classList.remove(
                        "d-none"
                    );

                }
                finally {

                    resetButton.disabled =
                        false;

                    resetButton.textContent =
                        "Reset Password";

                }

            }
        );

</script>


</body>

</html>
