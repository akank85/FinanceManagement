<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Management - Login</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: Arial, sans-serif;
        }

        .login-wrapper {
            min-height: 100vh;
        }

        .login-card {
            width: 100%;
            max-width: 540px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .logo-box {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;

            margin: 0 auto 18px;
        }

        .login-title {
            font-weight: 700;
            color: #212529;
        }

        .login-subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .form-label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            height: 52px;
            border-radius: 10px;
            border: 1px solid #dee2e6;
            font-size: 16px;
        }

        .form-control:focus {
            border-color: #0d6efd;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.12);
        }

        .login-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 16px;
        }

        .remember-row {
            font-size: 14px;
        }

        .forgot-link {
            color: #0d6efd;
            text-decoration: none;
            font-size: 14px;
            font-weight: 600;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        .footer-text {
            font-size: 13px;
            color: #8a8f98;
        }

        .modal-content {
            border: none;
            border-radius: 18px;
        }

        .modal-header {
            border-bottom: 1px solid #eee;
        }

        .modal-title {
            font-weight: 700;
        }

        .forgot-info {
            font-size: 14px;
            color: #6c757d;
            line-height: 1.6;
        }

        .forgot-btn {
            height: 48px;
            border-radius: 10px;
            font-weight: 600;
        }

    </style>

</head>


<body>

<div class="container login-wrapper d-flex align-items-center justify-content-center py-4">

    <div class="card login-card p-4 p-md-5">

        <div class="logo-box">
            ₹
        </div>

        <div class="text-center mb-4">

            <h3 class="login-title mb-2">
                Finance Management
            </h3>

            <p class="login-subtitle mb-0">
                Login to manage your finances
            </p>

        </div>


        <div
                id="errorMessage"
                class="alert alert-danger d-none"
                role="alert">
        </div>


        <div
                id="successMessage"
                class="alert alert-success d-none"
                role="alert">
        </div>


        <form id="loginForm">

            <div class="mb-3">

                <label
                        for="email"
                        class="form-label">

                    Email Address

                </label>

                <input
                        type="email"
                        class="form-control"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required>

            </div>


            <div class="mb-2">

                <label
                        for="password"
                        class="form-label">

                    Password

                </label>

                <input
                        type="password"
                        class="form-control"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required>

            </div>


            <div class="d-flex justify-content-between align-items-center mb-4">

                <div class="form-check remember-row">

                    <input
                            class="form-check-input"
                            type="checkbox"
                            id="rememberMe">

                    <label
                            class="form-check-label"
                            for="rememberMe">

                        Remember me

                    </label>

                </div>


                <a
                        href="#"
                        class="forgot-link"
                        data-bs-toggle="modal"
                        data-bs-target="#forgotPasswordModal">

                    Forgot Password?

                </a>

            </div>


            <div class="d-grid">

                <button
                        type="submit"
                        id="loginButton"
                        class="btn btn-primary login-btn">

                    <span id="buttonText">
                        Login
                    </span>

                    <span
                            id="buttonSpinner"
                            class="spinner-border spinner-border-sm d-none"
                            role="status">
                    </span>

                </button>

            </div>

        </form>


        <div class="text-center mt-4">

            <p class="footer-text mb-0">
                Secure Finance Management System
            </p>

        </div>

    </div>

</div>


<!-- ================= FORGOT PASSWORD MODAL ================= -->

<div
        class="modal fade"
        id="forgotPasswordModal"
        tabindex="-1"
        aria-hidden="true">

    <div class="modal-dialog modal-dialog-centered">

        <div class="modal-content">

            <div class="modal-header">

                <h5 class="modal-title">
                    Forgot Password
                </h5>

                <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                </button>

            </div>


            <div class="modal-body">

                <p class="forgot-info">

                    Enter your registered email address.
                    We will send a verification OTP to your
                    registered email before allowing you to
                    reset your password.

                </p>


                <div
                        id="forgotError"
                        class="alert alert-danger d-none">
                </div>


                <div
                        id="forgotSuccess"
                        class="alert alert-success d-none">
                </div>


                <form id="forgotPasswordForm">

                    <div class="mb-3">

                        <label
                                for="forgotEmail"
                                class="form-label">

                            Registered Email

                        </label>

                        <input
                                type="email"
                                id="forgotEmail"
                                class="form-control"
                                placeholder="Enter registered email"
                                required>

                    </div>


                    <div class="d-grid">

                        <button
                                type="submit"
                                id="forgotButton"
                                class="btn btn-primary forgot-btn">

                            Send OTP

                        </button>

                    </div>

                </form>

            </div>

        </div>

    </div>

</div>


<script
        src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


<script>

    /* =====================================================
       REMEMBER ME
       ===================================================== */

    const savedEmail =
        localStorage.getItem("rememberedEmail");

    if (savedEmail) {

        document.getElementById("email").value =
            savedEmail;

        document.getElementById("rememberMe").checked =
            true;

    }


    /* =====================================================
       LOGIN
       ===================================================== */

    document
        .getElementById("loginForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();

            const email =
                document
                    .getElementById("email")
                    .value
                    .trim();

            const password =
                document
                    .getElementById("password")
                    .value;

            const rememberMe =
                document
                    .getElementById("rememberMe")
                    .checked;

            const errorMessage =
                document.getElementById("errorMessage");

            const successMessage =
                document.getElementById("successMessage");

            const loginButton =
                document.getElementById("loginButton");

            const buttonText =
                document.getElementById("buttonText");

            const buttonSpinner =
                document.getElementById("buttonSpinner");


            errorMessage.classList.add("d-none");

            successMessage.classList.add("d-none");


            /* =================================================
               REMEMBER EMAIL
               ================================================= */

            if (rememberMe) {

                localStorage.setItem(
                    "rememberedEmail",
                    email
                );

            } else {

                localStorage.removeItem(
                    "rememberedEmail"
                );

            }


            loginButton.disabled = true;

            buttonText.textContent =
                "Logging in...";

            buttonSpinner.classList.remove(
                "d-none"
            );


            try {

                /* =================================================
                   LOGIN API
                   ================================================= */

                const response =
                    await fetch("/login", {

                        method: "POST",

                        headers: {

                            "Content-Type":
                                "application/json"

                        },

                        body: JSON.stringify({

                            email: email,

                            password: password

                        })

                    });


                /* =================================================
                   READ RESPONSE
                   ================================================= */

                const data =
                    await response.json();


                /* =================================================
                   LOGIN ERROR
                   ================================================= */

                if (!response.ok) {

                    let message =
                        "Invalid email or password";


                    if (
                        typeof data === "string"
                    ) {

                        message = data;

                    }
                    else if (
                        data &&
                        data.message
                    ) {

                        message = data.message;

                    }


                    throw new Error(message);

                }


                /* =================================================
                   SAVE LOGIN DETAILS
                   ================================================= */

                sessionStorage.setItem(
                    "loginEmail",
                    data.email
                );


                if (data.role) {

                    sessionStorage.setItem(
                        "userRole",
                        data.role
                    );

                }


                /* =================================================
                   SAVE USER ID
                   ================================================= */

                if (data.id) {

                    sessionStorage.setItem(
                        "userId",
                        data.id
                    );

                }


                /* =================================================
                   SAVE USER NAME
                   ================================================= */

                if (data.fullName) {

                    sessionStorage.setItem(
                        "userName",
                        data.fullName
                    );

                }


                /* =================================================
                   SAVE ACCESS TOKEN
                   ================================================= */

                if (data.accessToken) {

                    sessionStorage.setItem(
                        "accessToken",
                        data.accessToken
                    );

                    /*
                     * Also keep "token" because the existing
                     * 2FA page may use this key.
                     */

                    sessionStorage.setItem(
                        "token",
                        data.accessToken
                    );

                }


                /* =================================================
                   SAVE REFRESH TOKEN
                   ================================================= */

                if (data.refreshToken) {

                    sessionStorage.setItem(
                        "refreshToken",
                        data.refreshToken
                    );

                }


                /* =================================================
                   FIRST LOGIN
                   =================================================

                   If QR is returned by backend,
                   this is the first-time 2FA setup.

                   QR is saved and /2fa is opened.
                */

                if (data.qrCode) {

                    sessionStorage.setItem(
                        "qrCode",
                        data.qrCode
                    );

                    sessionStorage.setItem(
                        "firstTimeLogin",
                        "true"
                    );

                    window.location.href =
                        "/2fa";

                    return;
                }


                /* =================================================
                   EXISTING AUTHENTICATOR
                   =================================================

                   No QR means the authenticator is already
                   configured.

                   Open /2fa and ask for the existing
                   6-digit authenticator OTP.
                */

                sessionStorage.removeItem(
                    "qrCode"
                );

                sessionStorage.setItem(
                    "firstTimeLogin",
                    "false"
                );

                window.location.href =
                    "/2fa";

                return;


            }
            catch (error) {

                errorMessage.textContent =
                    error.message ||
                    "Login failed";


                errorMessage.classList.remove(
                    "d-none"
                );

            }
            finally {

                loginButton.disabled =
                    false;

                buttonText.textContent =
                    "Login";

                buttonSpinner.classList.add(
                    "d-none"
                );

            }

        });


    /* =====================================================
       FORGOT PASSWORD
       ===================================================== */

    document
        .getElementById("forgotPasswordForm")
        .addEventListener("submit", async function (event) {

            event.preventDefault();


            const email =
                document
                    .getElementById("forgotEmail")
                    .value
                    .trim();


            const forgotError =
                document.getElementById(
                    "forgotError"
                );


            const forgotSuccess =
                document.getElementById(
                    "forgotSuccess"
                );


            const forgotButton =
                document.getElementById(
                    "forgotButton"
                );


            forgotError.classList.add(
                "d-none"
            );

            forgotSuccess.classList.add(
                "d-none"
            );


            forgotButton.disabled =
                true;

            forgotButton.textContent =
                "Sending OTP...";


            try {

                const response =
                    await fetch(
                        "/forgot-password",
                        {

                            method: "POST",

                            headers: {

                                "Content-Type":
                                    "application/json"

                            },

                            body: JSON.stringify({

                                email: email

                            })

                        }
                    );


                const data =
                    await response.text();


                if (!response.ok) {

                    throw new Error(
                        data ||
                        "Unable to send OTP"
                    );

                }


                sessionStorage.setItem(
                    "forgotPasswordEmail",
                    email
                );


                window.location.href =
                    "/forgot-password-otp";


            }
            catch (error) {

                forgotError.textContent =
                    error.message ||
                    "Unable to send OTP";


                forgotError.classList.remove(
                    "d-none"
                );

            }
            finally {

                forgotButton.disabled =
                    false;

                forgotButton.textContent =
                    "Send OTP";

            }

        });

</script>

</body>

</html>
