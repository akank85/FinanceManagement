
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Authenticator Verification</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: Arial, sans-serif;
        }

        .otp-wrapper {
            min-height: 100vh;
        }

        .otp-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0,0,0,0.10);
        }

        .logo-box {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;

            margin: 0 auto 18px;
        }

        .title {
            font-weight: 700;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
            line-height: 1.6;
        }

        .email-text {
            font-weight: 600;
            color: #212529;
            word-break: break-all;
        }

        .form-label {
            font-weight: 600;
        }

        .form-control {
            height: 52px;
            border-radius: 10px;
            font-size: 20px;
            text-align: center;
            letter-spacing: 8px;
        }

        .verify-btn {
            height: 50px;
            border-radius: 10px;
            font-weight: 600;
        }

        .alert {
            border-radius: 10px;
            font-size: 14px;
        }

        .back-link {
            font-size: 14px;
            text-decoration: none;
        }

    </style>

</head>

<body>

<div class="container otp-wrapper d-flex align-items-center justify-content-center py-4">

    <div class="card otp-card p-4 p-md-5">

        <div class="logo-box">
            ₹
        </div>

        <div class="text-center mb-4">

            <h3 class="title mb-2">
                Authenticator Verification
            </h3>

            <p class="subtitle mb-2">

                Enter the 6 digit OTP from your
                Authenticator application.

            </p>

            <div
                    id="emailDisplay"
                    class="email-text">
            </div>

        </div>


        <div
                id="errorMessage"
                class="alert alert-danger d-none">
        </div>


        <div
                id="successMessage"
                class="alert alert-success d-none">
        </div>


        <form id="authenticatorForm">

            <div class="mb-4">

                <label
                        for="otp"
                        class="form-label">

                    Authenticator OTP

                </label>

                <input
                        type="text"
                        id="otp"
                        class="form-control"
                        maxlength="6"
                        minlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="••••••"
                        required>

            </div>


            <div class="d-grid">

                <button
                        type="submit"
                        id="verifyButton"
                        class="btn btn-primary verify-btn">

                    Verify Authenticator

                </button>

            </div>

        </form>


        <div class="text-center mt-4">

            <a
                    href="/login"
                    class="back-link">

                Back to Login

            </a>

        </div>

    </div>

</div>


<script>

    const email = sessionStorage.getItem("forgotPasswordEmail");
    const emailVerified = sessionStorage.getItem("forgotEmailVerified");
    if (!email || emailVerified !== "true") {window.location.href = "/login";}
    document.getElementById("emailDisplay").textContent = email;
    document.getElementById("otp").addEventListener("input", function () {
            this.value = this.value.replace(/\D/g, "").slice(0, 6);
        }
        );


    document.getElementById("authenticatorForm").addEventListener("submit",
            async function (event) {
                event.preventDefault();
                const otp = document
                        .getElementById("otp")
                        .value
                        .trim();
                const errorMessage = document.getElementById("errorMessage");
                const successMessage = document.getElementById("successMessage");
                const verifyButton = document.getElementById("verifyButton");
                errorMessage.classList.add("d-none");
                successMessage.classList.add("d-none");
                if (otp.length !== 6) {
                    errorMessage.textContent =
                        "Please enter a valid 6 digit OTP.";
                    errorMessage.classList.remove("d-none");
                    return;
                }
                verifyButton.disabled = true;verifyButton.textContent = "Verifying...";
                try {const response = await fetch("/verify-forgot-password-authenticator",
                            {
                                method: "POST",
                                headers: {
                                    "Content-Type": "application/json"
                                },
                                body: JSON.stringify({
                                    email: email, otp: otp

                                })

                            }
                        );


                    const text = await response.text();
                    if (!response.ok) {throw new Error(text || "Invalid Authenticator OTP");}
                    sessionStorage.setItem("forgotAuthenticatorVerified", "true");
                    successMessage.textContent = "Authenticator verified successfully.";
                    successMessage.classList.remove("d-none");
                    setTimeout(function () {
                            window.location.href = "/reset-password";}, 700);


                } catch (error) {

                    errorMessage.textContent = error.message || "Authenticator verification failed";
                    errorMessage.classList.remove("d-none");
                } finally {
                    verifyButton.disabled = false;
                    verifyButton.textContent = "Verify Authenticator";
                }
            }
        );

</script>

</body>

</html>
