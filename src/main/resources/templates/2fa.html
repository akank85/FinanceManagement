
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Finance Management - Two-Factor Authentication</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <style>

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            font-family: Arial, sans-serif;
        }

        .twofa-wrapper {
            min-height: 100vh;
        }

        .twofa-card {
            width: 100%;
            max-width: 500px;
            border: none;
            border-radius: 20px;
            background: #ffffff;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.10);
        }

        .logo-box {
            width: 65px;
            height: 65px;
            border-radius: 16px;
            background: #0d6efd;
            color: white;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 28px;
            font-weight: bold;

            margin: 0 auto 18px;
        }

        .twofa-title {
            font-weight: 700;
            color: #212529;
        }

        .subtitle {
            color: #6c757d;
            font-size: 14px;
        }

        .step-text {
            color: #495057;
            font-size: 14px;
            line-height: 1.6;
        }

        .qr-container {
            width: 320px;
            height: 320px;

            margin: 20px auto;

            padding: 10px;

            border: 1px solid #dee2e6;
            border-radius: 12px;

            background: white;
        }

        #qrImage {
            width: 100%;
            height: 100%;

            object-fit: contain;

            image-rendering: pixelated;
        }

        .otp-input {
            height: 55px;

            border-radius: 10px;

            text-align: center;

            font-size: 24px;

            letter-spacing: 8px;

            font-weight: 600;
        }

        .otp-input:focus {
            border-color: #0d6efd;

            box-shadow:
                    0 0 0 0.2rem
                    rgba(13, 110, 253, 0.12);
        }

        .verify-btn {
            height: 50px;

            border-radius: 10px;

            font-weight: 600;

            font-size: 16px;
        }

        .alert {
            border-radius: 10px;

            font-size: 14px;
        }

        .footer-text {
            font-size: 13px;

            color: #8a8f98;
        }

        @media (max-width: 500px) {

            .twofa-card {
                margin: 15px;
            }

            .qr-container {
                width: 270px;
                height: 270px;
            }

        }

    </style>

</head>


<body>

<div class="container twofa-wrapper d-flex align-items-center justify-content-center py-4">

    <div class="card twofa-card p-4 p-md-5">

        <!-- Logo -->

        <div class="logo-box">
            ₹
        </div>


        <!-- Heading -->

        <div class="text-center mb-4">

            <h3 class="twofa-title mb-2">
                Two-Factor Authentication
            </h3>

            <p class="subtitle mb-0">
                Secure your Finance Management account
            </p>

        </div>


        <!-- Instruction -->

        <div class="mb-3">

            <p id="stepInstruction" class="step-text mb-2">

                <strong>Step 1:</strong>

                Scan the QR code using Google Authenticator
                or Microsoft Authenticator.

            </p>

        </div>


        <!-- QR Code -->

        <div
                id="qrContainer"
                class="qr-container">

            <img
                    id="qrImage"
                    src=""
                    alt="Two Factor Authentication QR Code">

        </div>


        <!-- OTP Instruction -->

        <div class="text-center mb-4">

            <p
                    id="otpInstruction"
                    class="subtitle mb-0">

                After scanning, your authenticator app will
                generate a 6-digit verification code.

            </p>

        </div>


        <!-- Error -->

        <div
                id="errorMessage"
                class="alert alert-danger d-none"
                role="alert">
        </div>


        <!-- Success -->

        <div
                id="successMessage"
                class="alert alert-success d-none"
                role="alert">
        </div>


        <!-- OTP Form -->

        <form id="otpForm">

            <div class="mb-4">

                <label
                        for="otp"
                        class="form-label fw-semibold">

                    Enter 6-digit OTP

                </label>


                <input
                        type="text"
                        id="otp"
                        class="form-control otp-input"
                        maxlength="6"
                        minlength="6"
                        inputmode="numeric"
                        autocomplete="one-time-code"
                        placeholder="000000"
                        required>

            </div>


            <div class="d-grid">

                <button
                        type="submit"
                        id="verifyButton"
                        class="btn btn-primary verify-btn">

                    Verify OTP

                </button>

            </div>

        </form>


        <!-- Footer -->

        <div class="text-center mt-4">

            <p class="footer-text mb-0">

                Secure Finance Management System

            </p>

        </div>

    </div>

</div>



<script>

    /* =====================================================
       LOGIN DETAILS
       ===================================================== */

    const email =
        sessionStorage.getItem("loginEmail");

    const qrCode =
        sessionStorage.getItem("qrCode");

    const firstTimeLogin =
        sessionStorage.getItem("firstTimeLogin");


    if (!email) {

        window.location.href = "/login";

    }


    /* =====================================================
       ELEMENTS
       ===================================================== */

    const qrContainer =
        document.getElementById("qrContainer");

    const qrImage =
        document.getElementById("qrImage");

    const stepInstruction =
        document.getElementById("stepInstruction");

    const otpInstruction =
        document.getElementById("otpInstruction");


    /* =====================================================
       FIRST TIME LOGIN
       ===================================================== */

    if (
        firstTimeLogin === "true" &&
        qrCode
    ) {

        qrContainer.style.display = "block";

        qrImage.src =
            "data:image/png;base64," + qrCode;


        stepInstruction.innerHTML = `

            <strong>Step 1:</strong>

            Scan this QR code using Google Authenticator
            or Microsoft Authenticator.

        `;


        otpInstruction.textContent =
            "After scanning, your authenticator app will generate a 6-digit verification code.";

    }


    /* =====================================================
       SECOND LOGIN
       EXISTING AUTHENTICATOR
       ===================================================== */

    if (
        firstTimeLogin === "false"
    ) {

        qrContainer.style.display = "none";


        stepInstruction.innerHTML = `

            <strong>Step 1:</strong>

            Open your authenticator app and select
            FinanceManagement.

        `;


        otpInstruction.textContent =
            "Enter the current 6-digit verification code generated by your authenticator app.";

    }


    /* =====================================================
       OTP INPUT
       ===================================================== */

    const otpInput =
        document.getElementById("otp");


    otpInput.addEventListener(
        "input",
        function () {

            this.value =
                this.value
                    .replace(/\D/g, "")
                    .substring(0, 6);

        }
    );


    /* =====================================================
       VERIFY OTP
       ===================================================== */

    document
        .getElementById("otpForm")
        .addEventListener(
            "submit",
            async function (event) {

                event.preventDefault();


                const otp =
                    otpInput.value;


                const errorMessage =
                    document.getElementById(
                        "errorMessage"
                    );


                const successMessage =
                    document.getElementById(
                        "successMessage"
                    );


                const verifyButton =
                    document.getElementById(
                        "verifyButton"
                    );


                errorMessage.classList.add(
                    "d-none"
                );


                successMessage.classList.add(
                    "d-none"
                );


                /* =================================================
                   VALIDATE OTP
                   ================================================= */

                if (!/^\d{6}$/.test(otp)) {

                    errorMessage.textContent =
                        "Please enter a valid 6-digit OTP.";


                    errorMessage.classList.remove(
                        "d-none"
                    );


                    return;

                }


                /* =================================================
                   DISABLE BUTTON
                   ================================================= */

                verifyButton.disabled =
                    true;

                verifyButton.textContent =
                    "Verifying...";


                try {

                    /* =================================================
                       SEND OTP TO BACKEND
                       ================================================= */

                    const response =
                        await fetch(
                            "/verify-otp",
                            {

                                method: "POST",

                                headers: {

                                    "Content-Type":
                                        "application/json"

                                },

                                body: JSON.stringify({

                                    email: email,

                                    otp: otp

                                })

                            }
                        );


                    /* =================================================
                       READ BACKEND RESPONSE

                       SUCCESS = JSON
                       ERROR   = PLAIN TEXT
                       ================================================= */

                    let data;


                    if (response.ok) {

                        data =
                            await response.json();

                    } else {

                        const errorText =
                            await response.text();


                        throw new Error(
                            errorText ||
                            "Invalid OTP"
                        );

                    }


                    /* =================================================
                       SAVE JWT DETAILS
                       ================================================= */

                    sessionStorage.setItem(
                        "accessToken",
                        data.accessToken
                    );


                    sessionStorage.setItem(
                        "refreshToken",
                        data.refreshToken
                    );


                    sessionStorage.setItem(
                        "userId",
                        data.id
                    );


                    sessionStorage.setItem(
                        "userName",
                        data.fullName
                    );


                    sessionStorage.setItem(
                        "userEmail",
                        data.email
                    );


                    sessionStorage.setItem(
                        "userRole",
                        data.role
                    );


                    /* =================================================
                       REMOVE TEMPORARY LOGIN DATA
                       ================================================= */

                    sessionStorage.removeItem(
                        "qrCode"
                    );


                    sessionStorage.removeItem(
                        "loginEmail"
                    );


                    sessionStorage.removeItem(
                        "firstTimeLogin"
                    );


                    /* =================================================
                       SUCCESS MESSAGE
                       ================================================= */

                    successMessage.textContent =
                        "OTP verified successfully.";


                    successMessage.classList.remove(
                        "d-none"
                    );


                    /* =================================================
                       GO TO DASHBOARD
                       ================================================= */

                    setTimeout(
                        function () {

                            window.location.href =
                                "/dashboard";

                        },
                        800
                    );

                }

                catch (error) {

                    errorMessage.textContent =
                        error.message ||
                        "OTP verification failed.";


                    errorMessage.classList.remove(
                        "d-none"
                    );

                }

                finally {

                    verifyButton.disabled =
                        false;

                    verifyButton.textContent =
                        "Verify OTP";

                }

            }
        );

</script>

</body>

</html>
